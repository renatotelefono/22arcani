<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>22 Arcani</title>
  <style>
    :root { --bg: #14110f; --fg: #efe6d6; --muted: #a8998a; --gold: #c9a45c; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--fg);
      font-family: Georgia, "Times New Roman", serif; text-align: center;
    }
    h1 { font-size: clamp(2.4rem, 8vw, 4rem); font-weight: normal; letter-spacing: .04em; }
    h1 span { color: var(--gold); }
    p { margin-top: 1rem; color: var(--muted); font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1><span>22</span> Arcani</h1>
    <p>I tarocchi di Marsiglia. Presto online.</p>
  </main>
</body>
</html>
