<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Zodiel – Sei offline</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#111;color:#e8e8e8;font-family:Georgia,'Playfair Display',serif;text-align:center;padding:24px;box-sizing:border-box}
    img{width:96px;height:96px;margin-bottom:18px}
    h1{color:#40E0D0;font-size:26px;margin:0 0 12px;letter-spacing:1px}
    p{font-size:17px;line-height:1.5;max-width:340px;margin:0 auto 24px;opacity:.9}
    button{background:#40E0D0;color:#000;border:0;border-radius:18px;padding:12px 28px;font-size:16px;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="Zodiel">
    <h1>Le carte riposano…</h1>
    <p>Sembra che tu non sia connesso a internet. Le letture di Zodiel hanno bisogno della rete: riprova appena torna il segnale.</p>
    <button onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
